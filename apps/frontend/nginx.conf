# Link-preview crawlers (#475): they run no JavaScript, so on an invite link they get the
# backend's small Open Graph page instead of the SPA shell. This file is included inside
# `http`. The invite location below takes its code by a named capture, which matching this
# regex can't overwrite (unlike $1).
map $http_user_agent $is_preview_bot {
  default 0;
  "~*(?:facebookexternalhit|Facebot|WhatsApp|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|SkypeUriPreview|Applebot)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  # The app is a single-page bundle: routing happens in the browser, so any
  # unknown path has to return the shell. Without this, a hard refresh on
  # /akce is a 404 — there is no such file on disk.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # An invite link /pozvanka/{code} (#406; the code is 22 base64url characters): crawlers of
  # WhatsApp, Messenger, iMessage… go to the backend's preview, which has the inviter's first
  # name (GET /api/invites/:code/preview); people get the SPA as anywhere else. A redirect, not a
  # proxy: the backend sits behind Coolify's proxy on the same origin under /api. Relative
  # Location, so it keeps the https the proxy terminated. `if` with only `return` is safe.
  location ~ "^/pozvanka/(?<invite_code>[A-Za-z0-9_-]{22})/?$" {
    absolute_redirect off;
    add_header Cache-Control "no-cache";
    add_header Vary "User-Agent";
    include /etc/nginx/security-headers.conf;
    if ($is_preview_bot) {
      return 302 /api/invites/$invite_code/preview;
    }
    try_files /index.html =404;
  }

  # index.html names the hashed bundles, so it must never be cached: a stale
  # copy points at asset files that no longer exist after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Vite fingerprints everything under /assets/, so a given URL's contents can
  # never change. Safe to cache forever.
  location /assets/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.conf;
  }
}
