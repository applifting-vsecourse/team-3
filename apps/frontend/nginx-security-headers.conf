# Included in every location with its own add_header: nginx drops the headers of
# the enclosing level as soon as a location adds one.
#
# frame-ancestors: other team apps are the same site, so the session cookie
# works in their frames and a hidden frame could take the user's clicks.
# Images, styles and connections stay open: map tiles, Leaflet's inline styles
# and the address search come from elsewhere or are inline.
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; script-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
