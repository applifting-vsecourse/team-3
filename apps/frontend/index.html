<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser chrome colour = --hero (global.css): the header sits on the band. Light mode only; tokens.test.ts keeps it in sync. -->
    <meta name="theme-color" content="#0f3626" />
    <meta name="description" content="HobbyHub – najdi partu na sport, hry a další koníčky ve svém okolí." />
    <!-- HobbyHub mark (Figma Logo/Mark); the .ico is the same image for older browsers. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>HobbyHub</title>
    <!-- Link previews (WhatsApp, Messenger, iMessage, X…, #475): crawlers run no JavaScript, so these are static. og:image is absolute from the VITE_PUBLIC_URL build arg. An invite link gets its own preview from the backend (nginx.conf). -->
    <meta property="og:site_name" content="HobbyHub" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="cs_CZ" />
    <meta property="og:title" content="HobbyHub – akce a parťáci na koníčky" />
    <meta property="og:description" content="HobbyHub – najdi partu na sport, hry a další koníčky ve svém okolí." />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/og-hobbyhub.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo HobbyHub na zeleném pozadí" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
