name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the code; GITHUB_TOKEN gets nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # throwaway database for the main-flow check (#467); nothing else uses it
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hobbyhub
          POSTGRES_PASSWORD: hobbyhub
          POSTGRES_DB: hobbyhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hobbyhub -d hobbyhub_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: pnpm env:check

      - name: Generate Prisma client
        run: pnpm backend prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint backend
        run: pnpm backend lint:check

      - name: Lint frontend
        run: pnpm frontend lint:check

      - name: Type-check frontend
        run: pnpm frontend type-check

      - name: Test backend
        run: pnpm backend test

      - name: Test verification link and automatic sign-in
        run: pnpm backend auth:check-verification-link

      - name: Test email verification and sign-in
        run: pnpm backend auth:check-email-verification

      - name: Test main flow through the API on a real database (#467)
        env:
          DATABASE_URL: postgresql://hobbyhub:hobbyhub@localhost:5432/hobbyhub_ci
        run: |
          pnpm backend migrate
          pnpm backend check:main-flow

      - name: Test frontend
        run: pnpm frontend test:ci

      - name: Build backend
        run: pnpm backend build

      - name: Build frontend
        run: pnpm frontend build
