version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security fixes open their own PRs; routine bumps are grouped to keep the board readable.
    groups:
      # NestJS packages only work on the same major, so they move together, majors included.
      nestjs:
        patterns: ['@nestjs/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node major we run (24, see .nvmrc); a newer major would allow APIs Node 24 lacks.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # In 0.x a minor is breaking (0.35 changed the typings); sharp is pinned for the Alpine binary, upgrade it by hand.
      - dependency-name: sharp
        update-types: [version-update:semver-minor]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/frontend
    schedule:
      interval: weekly
    # A new Node major also means .nvmrc, engines and everyone's local Node — a planned change, not a bump.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
