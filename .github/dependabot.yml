version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security fixes open their own PRs; routine bumps are grouped to keep the board readable.
    groups:
      # NestJS packages only work on the same major, so their minor and patch updates move together.
      nestjs:
        patterns: ['@nestjs/*']
      minor-and-patch:
        update-types: [minor, patch]
    # NestJS 12 needs the backend on ESM (Jest cannot require it) — a planned migration, not a bump.
    ignore:
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /apps/backend
      - /apps/frontend
    schedule:
      interval: weekly
    # A new Node major also means .nvmrc, engines and everyone's local Node — a planned change, not a bump.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
