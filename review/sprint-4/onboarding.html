<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HobbyHub · Návrh onboardingu #296</title>
<style>
  :root{color-scheme:light;--bg:#f5f5ef;--card:#fff;--ink:#14201a;--muted:#53655a;--hero:#172d22;--hero-soft:#385448;--accent:#ceec87;--edge:#d3dfd1;--on:#edf5e9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:1rem system-ui,sans-serif}
  button,input{font:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid #527930;outline-offset:3px}
  .review{max-width:1136px;margin:0 auto;padding:22px 18px}
  .summary{display:flex;gap:8px;justify-content:space-between;align-items:baseline;flex-wrap:wrap}
  .summary h1{font-size:1.25rem;margin:0}
  .summary p{margin:0;color:var(--muted);font-size:.875rem}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  .tabs button,.button{border:1px solid var(--edge);border-radius:9px;background:var(--card);color:var(--ink);min-height:44px;padding:0 12px}
  .tabs button[aria-pressed=true],.primary{background:var(--accent);border-color:#b8d276;font-weight:650}
  .wizard{background:var(--bg);border:1px solid var(--edge);border-radius:16px;overflow:hidden;position:relative;min-width:0}
  .bar{height:58px;display:flex;align-items:center;gap:12px;background:var(--hero);color:var(--on);padding:0 16px}
  .logo{font-weight:850;letter-spacing:-.045em;font-size:1.35rem;white-space:nowrap}
  .logo i{display:inline-block;width:.72em;height:.72em;border:2px solid var(--accent);border-radius:50%;margin-right:.4em}
  .step{margin-left:auto;white-space:nowrap;font-size:.8rem}
  .bar button{border:0;background:none;color:inherit;padding:7px;min-height:44px;border-radius:8px;white-space:nowrap}
  .inner{display:grid;grid-template-columns:245px minmax(0,1fr)}
  .aside{background:var(--hero);color:var(--on);padding:32px 18px;display:grid;align-content:start;gap:12px}
  .image{background-size:cover;background-position:center;border-radius:12px}
  .aside .image{min-height:230px;aspect-ratio:4/5}
  .aside b{font-size:1.25rem}
  .content{padding:24px;min-width:0}
  .content h2,.modal h2{margin:0 0 8px;letter-spacing:-.045em;font-size:clamp(1.8rem,5vw,2.3rem);line-height:1.14}
  .content p,.modal p{margin:0 0 16px;color:var(--muted);line-height:1.45}
  .position{margin-bottom:12px}
  .search-label,.section-title{display:block;font-weight:650;margin:10px 0 7px}
  .search{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid var(--edge);background:var(--card);color:var(--ink)}
  .places{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:0;margin:0;gap:8px}
  .places li{min-height:48px;background:var(--card);border:1px solid var(--edge);border-radius:9px;padding:8px 12px;display:grid;align-content:center;overflow-wrap:anywhere}
  small{color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
  .photo{min-height:98px;display:flex;align-items:end;padding:8px;color:#fff;font-weight:700;font-size:.94rem;overflow-wrap:anywhere}
  .example{margin-top:10px;background:#e2edda;border:1px solid var(--edge);border-radius:10px;padding:10px}
  .example small{display:block}
  .tray{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--hero);color:var(--on);padding:8px 12px;border-radius:14px;margin-top:16px}
  .tray small{display:block;color:#cadbd0}
  .slots{display:flex;gap:6px}
  .slot{height:44px;width:44px;border:1px dashed #a8bcae;border-radius:8px;display:grid;place-items:center}
  .tray .button{margin-left:auto}
  .veil{position:absolute;inset:0;background:#14251cbf;display:grid;place-items:center;padding:14px}
  .modal{width:min(100%,516px);background:var(--card);border-radius:15px;overflow:hidden}
  .modal .hero{background:var(--hero);color:var(--on);padding:17px}
  .modal .hero p{color:#d6e4d9}
  .modal .body{padding:17px}
  .modal button{margin:0 5px 5px 0}
  .note{margin-top:10px;color:var(--muted);font-size:.875rem}
  .mobile .wizard{max-width:390px;margin:0 auto}
  .mobile .inner{grid-template-columns:1fr}
  .mobile .aside{display:none}
  .mobile .content{padding:16px}
  .mobile .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .compact-photo{display:none}
  .mobile .compact-photo{display:block;min-height:126px;margin-top:14px}
  @media(max-width:680px){
    .inner{grid-template-columns:1fr}.aside{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    .content{padding:14px}.compact-photo{display:block;min-height:126px;margin-top:14px}
  }
  @media(max-width:359px){.places{grid-template-columns:1fr}}

<script>
const groups=[["Týmové sporty","volejbal"],["Raketové sporty","badminton"],["Pohyb a tanec","tanec"],["Outdoor","turistika"],["Hry","deskove-hry"],["Kvízy a jazyky","pub-kviz"],["Tvoření a hudba","fotografie"],["Komunita","komunitni-zahrada"]];
const activities=[["Volejbal","volejbal"],["Florbal","florbal"],["Fotbal a malá kopaná","fotbal"],["Badminton","badminton"]];
const states=[
 ["Lokalita","Odhad z připojení se nabídne jako první. Kliknutí na místo otevře zájmy. Dlaždice roste s popiskem."],
 ["Okruhy","Hledat jde napříč okruhy. Vybrat lze jednu až tři aktivity."],
 ["Aktivity","Ukázka se zobrazí, pokud je v okruhu akce do 25 km. Výběr potvrdí uživatel v dolní liště."],
 ["Potvrzení","Uložení otevře akce podle zájmů ve vybrané lokalitě. Návrat zachová výběr."],
 ["Přeskočení","Teď ne je vidět v obou krocích. Průvodce se po potvrzení odchodu znovu neotevře."],
];
let state=0, mobile=false, returnState=0, locationName="Praha 13", skipFrom=0;
const photo=([name,key])=>'<div class="image photo" data-photo="'+key+'">'+name+'</div>';
const btn=(label,action,extra="")=>'<button type="button" class="button '+extra+'" data-action="'+action+'">'+label+'</button>';
function draw(){
  const base=state===4?skipFrom:state;
  const place=base===0, inside=base>=2;
  document.querySelector(".review").classList.toggle("mobile",mobile);
  document.querySelector(".tabs").innerHTML=states.map(([name],i)=>'<button type="button" data-state="'+i+'" aria-pressed="'+(state===i)+'">'+name+'</button>').join("")+'<button type="button" data-action="size" aria-pressed="'+mobile+'">Mobil 390 px</button>';
  const places=["Praha 13","Praha","Brno","Ostrava","Plzeň","Liberec","Olomouc","Ústí nad Labem"];
  const stage=place?
    '<h2>Kde se potkáme?</h2><p>Vyber místo, odkud chceš hledat akce.</p><label class="search-label" for="input">Město nebo městská část</label><input id="input" class="search" placeholder="Zkus Praha 8 nebo Břeclav"><strong class="section-title">Vyber místo</strong><ul class="places">'+places.map((x,i)=>'<li tabindex="0" role="button" data-place="'+x+'">'+x+(i===0?'<small>Odhad podle připojení</small>':"")+'</li>').join("")+'</ul><div class="image compact-photo" data-photo="welcome"></div>':
    '<h2>Co tě baví?</h2><p>Vyber jednu až tři aktivity, na které máš chuť.</p><div class="position">'+btn(locationName,"locality")+'</div><input class="search" aria-label="Hledat aktivitu" placeholder="Najdi třeba volejbal, deskovky nebo běh"><strong class="section-title">'+(inside?btn("Změnit okruh","groups")+' Týmové sporty':'Prozkoumej okruhy')+'</strong>'+(inside?'<div class="example"><small>Do 25 km od vybraného místa</small><b>Volejbal po práci · Praha 9</b></div>':"")+'<div class="cards">'+(inside?activities:groups).map(item=>'<div role="button" tabindex="0" data-action="'+(inside?"pick":"activities")+'">'+photo(item)+'</div>').join("")+'</div><div class="tray"><div><b>Tvůj výběr</b><small>Vybráno '+(inside?1:0)+' ze 3</small></div><div class="slots"><span class="slot image" '+(inside?'data-photo="volejbal"':"")+'>'+(inside?"":"+")+'</span><span class="slot">+</span><span class="slot">+</span></div>'+(inside?btn("Pokračovat s výběrem","confirm","primary"):"")+'</div>';
  const modal=state===3?'<div class="veil"><section class="modal" role="dialog" aria-label="Máš vybráno!"><div class="hero"><h2>Máš vybráno!</h2><p>Ukážeme ti akce v okolí podle toho, co tě baví. Vybrané místo je '+locationName+'.</p><div class="cards">'+photo(activities[0])+'</div></div><div class="body"><p>Lokalitu a zájmy můžeš kdykoli změnit v Můj profil.</p>'+btn("Uložit a ukázat akce","shown","primary")+btn("Zpět k výběru","activities")+'</div></section></div>':
    state===4?'<div class="veil"><section class="modal" role="dialog" aria-label="Odejít z průvodce?"><div class="body"><h2>Odejít z průvodce?</h2><p>Rozdělaný výběr se neuloží a průvodce se příště sám neotevře. Domovské místo i zájmy si můžeš později nastavit v profilu.</p>'+btn("Zůstat v průvodci","back","primary")+btn("Odejít bez uložení","shown")+'</div></section></div>':"";
  document.querySelector("#preview").innerHTML='<article class="wizard"><header class="bar">'+(!place?'<button type="button" aria-label="Zpět k místu" data-action="locality">←</button>':"")+'<span class="logo"><i></i>HobbyHub</span><span class="step">Krok '+(place?1:2)+' ze 2</span><button type="button" data-action="skip">Teď ne</button></header><div class="inner"><aside class="aside"><div class="image" data-photo="'+(place?"welcome":"volejbal")+'"></div><b>Na co máš chuť?</b></aside><section class="content">'+stage+'</section></div>'+modal+'</article>';
  document.querySelector("#note").textContent=states[state][1];
}
function action(event){
  const el=event.target.closest("[data-state],[data-place],[data-action]");
  if(!el)return;
  if(el.dataset.state!==undefined){
    if(+el.dataset.state===4)skipFrom=0;
    state=+el.dataset.state;
  } else if(el.dataset.place){
    locationName=el.dataset.place;
    state=1;
  } else switch(el.dataset.action){
    case "size":mobile=!mobile;break;
    case "locality":state=0;break;
    case "groups":state=1;break;
    case "activities":case "pick":state=2;break;
    case "confirm":state=3;break;
    case "skip":returnState=state;skipFrom=state===3?2:state;state=4;break;
    case "back":state=returnState;break;
    case "shown":document.querySelector("#note").textContent=state===4?"Konec ukázky · průvodce přeskočen.":"Konec ukázky · akce podle vybraných zájmů.";return;
  }
  draw();
}
document.addEventListener("click",action);
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute("role")==="button"){e.preventDefault();action(e);}});
draw();
</script>
</body>
</html>
